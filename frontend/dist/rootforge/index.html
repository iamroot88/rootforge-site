<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rootforge</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: #0e1116;
      color: #e8edf4;
      line-height: 1.6;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 3rem 1.25rem 4rem;
    }
    h1, h2 {
      line-height: 1.25;
      font-weight: 650;
    }
    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.85rem;
      letter-spacing: -0.02em;
    }
    h2 {
      margin: 2rem 0 0.6rem;
      font-size: 1.15rem;
    }
    p, li { color: #c5ced9; }
    .brand {
      color: #8be0c0;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .meta {
      color: #93a0b0;
      font-size: 0.95rem;
    }
    a { color: #8be0c0; }
    ul { padding-left: 1.2rem; }
    li { margin: 0.35rem 0; }
    footer {
      margin-top: 2.5rem;
      padding-top: 1rem;
      border-top: 1px solid #243040;
      color: #93a0b0;
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">Rootforge</p>
    <h1>Rootforge</h1>
    <p class="meta">Independent studio</p>

    <p>
      Rootforge is a small independent studio that makes simple apps and games.
    </p>

    <ul>
      <li><a href="/rootforge/privacy/">Privacy Policy</a></li>
      <li><a href="/rootforge/support/">Support</a></li>
    </ul>

    <footer>
      © 2026 Rootforge
    </footer>
  </main>
</body>
</html>
